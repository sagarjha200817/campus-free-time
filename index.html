<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Free-Time Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900">🕒 Campus Free-Time Sync</h1>
            <p class="text-gray-600 mt-2">Check who among your friends is free at 2:00 PM or any time slot!</p>
        </div>

        <!-- Input Card -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <!-- User Select -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Who are you?</label>
                    <select id="currentUser" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">Loading names...</option>
                    </select>
                </div>

                <!-- Day Select -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Day</label>
                    <select id="selectDay" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>

                <!-- Time Select -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Time</label>
                    <select id="selectTime" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="9:00">9:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="12:00">12:00 PM (Lunch)</option>
                        <option value="1:00">1:00 PM</option>
                        <option value="2:00" selected>2:00 PM</option>
                        <option value="3:00">3:00 PM</option>
                        <option value="4:00">4:00 PM</option>
                    </select>
                </div>
            </div>

            <button onclick="checkAvailability()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-sm">
                Check Who Is Free 🚀
            </button>
        </div>

        <!-- Results Container -->
        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
